name: Build Standalone App

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - '**.py'
      - 'requirements.txt'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        # --windowed hides the console. 
        # --onedir is faster and more stable for PySide6/soundfile/numpy.
        run: |
          pyinstaller --noconfirm --windowed --onedir --name "BatchWavTrimmer" app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchWavTrimmer-Windows
          path: dist/BatchWavTrimmer/

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller
        # On macOS, --windowed automatically creates a macOS .app bundle.
        run: |
          pyinstaller --noconfirm --windowed --name "BatchWavTrimmer" app.py

      - name: Compress App Bundle
        # Zipping the .app bundle is strictly required to preserve macOS executable 
        # permissions and symlinks when uploading through GitHub Actions.
        run: |
          cd dist
          zip -ry BatchWavTrimmer-macOS.zip BatchWavTrimmer.app/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatchWavTrimmer-macOS
          path: dist/BatchWavTrimmer-macOS.zip